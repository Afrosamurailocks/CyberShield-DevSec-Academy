name: Dependency graph (development)

# A branch padrao deste repositorio (`main`) fica vazia de proposito — o
# codigo vive em `development`. O dependency graph / alertas do Dependabot
# nativos do GitHub so leem manifestos do branch padrao, entao este workflow
# envia o grafo manualmente via Dependency Submission API a cada push em
# `development`, usando @github/dependency-submission-toolkit.
on:
  push:
    branches: [development]
  workflow_dispatch: {}

permissions:
  # a Dependency Submission API exige "contents: write" no token da Action
  # (ver https://docs.github.com/rest/dependency-graph/dependency-submission)
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala dependencias (inclui o toolkit de submissao)
        run: npm install --legacy-peer-deps

      - name: Gera e envia o snapshot do dependency graph
        env:
          INPUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/submit-dependency-graph.mjs
